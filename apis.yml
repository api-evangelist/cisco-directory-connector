description: >-
  The Cisco Directory Connector is an on-premises Windows service that
  synchronizes users and groups from a corporate directory (typically
  Microsoft Active Directory or LDAP) into Cisco Webex Control Hub. It
  supports full and incremental sync, attribute mapping, dry-run preview,
  and scheduled jobs. Programmatic management is via the related Webex
  People, Groups, and Organizations APIs in Control Hub; modern
  deployments increasingly use SCIM 2.0 provisioning from identity
  providers (Azure AD, Okta) as an alternative to the on-premises
  connector.
